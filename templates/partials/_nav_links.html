<li><a href="/conditions/"{% if p|slice:":12" == "/conditions/" %} aria-current="page"{% endif %}>بیماری‌ها و اقدامات</a></li>

<li><a href="/contact/"{% if p == "/contact/" %} aria-current="page"{% endif %}>تماس</a></li>
{% endwith %}
