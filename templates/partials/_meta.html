{% load static %}{# Default meta tags. A page overrides the blocks `title` and `description`. #}
<title>{% block title %}{% if profile %}{{ profile.full_name }}{% if profile.intro_tagline %} · {{ profile.intro_tagline }}{% endif %}{% endif %}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ default_description }}{% endblock %}">
<link rel="canonical" href="{{ site_url }}{{ request.path }}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:locale" content="fa_IR">
<meta property="og:site_name" content="{{ profile.full_name }}">
<meta property="og:title" content="{% block og_title %}{{ profile.full_name }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ default_description }}{% endblock %}">
<meta property="og:url" content="{{ site_url }}{{ request.path }}">
<meta property="og:image" content="{{ site_url }}{% static 'assets/img/icon.jpg' %}">
<meta property="og:image:width" content="1080">
<meta property="og:image:height" content="1080">
<meta name="twitter:card" content="summary">
